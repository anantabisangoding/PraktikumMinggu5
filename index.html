<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ruang Baca Telkom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>

  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">Ruang Baca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarRuangBaca" aria-controls="navbarRuangBaca"
              aria-expanded="false" aria-label="Buka navigasi">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarRuangBaca">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Tentang</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bantuan</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="card border-0 shadow">
          <div class="card-body p-4">
            <h1 class="h4 text-center mb-2">Masuk ke Ruang Baca</h1>
            <p class="text-secondary text-center small mb-4">Temukan bacaan untuk hari ini</p>

            <form>
              <div class="mb-3">
                <label for="username" class="form-label small">Username</label>
                <input type="text" class="form-control" id="username"
                       placeholder="Masukkan username" autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="password" class="form-label small">Password</label>
                <input type="password" class="form-control" id="password"
                       placeholder="Masukkan password" autocomplete="current-password">
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" value="" id="ingatSaya">
                <label class="form-check-label small" for="ingatSaya">Ingat saya</label>
              </div>

              <button type="button" class="btn btn-success w-100">Masuk</button>
            </form>
          </div>
          <div class="card-footer bg-white text-center py-3">
            <a href="#" class="link-success small">Lupa password?</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
